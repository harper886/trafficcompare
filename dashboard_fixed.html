          SNIPER: { aucpr: 0.4704, aucroc: 0.7829, f1: 0.4137, acc: 0.8912, recall: 0.2694 },
          Myplan: { aucpr: 0.5617, aucroc: 0.8290, f1: 0.4730, acc: 0.7733, recall: 0.7055 }
        },
        ablation: {
          noSmoothNoStream: { aucpr: 0.4725, aucroc: 0.7840, f1: 0.4137, acc: 0.7417, recall: 0.6318 },
          noSmooth: { aucpr: 0.5176, aucroc: 0.8071, f1: 0.4433, acc: 0.7576, recall: 0.6693 },
          noStream: { aucpr: 0.5136, aucroc: 0.8191, f1: 0.4465, acc: 0.7889, recall: 0.6401 },
          full: { aucpr: 0.5617, aucroc: 0.8290, f1: 0.4730, acc: 0.7733, recall: 0.7055 }
        }
      }
    };

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function getRiskText(probability) {
      if (probability >= 0.8) return "高风险";
      if (probability >= 0.65) return "重点关注";
      if (probability >= 0.45) return "波动增强";
      return "平稳";
    }

    function getRiskFillColor(probability) {
      if (probability >= 0.8) return "#b91c1c";
      if (probability >= 0.65) return "#f59e0b";
      if (probability >= 0.45) return "#eab308";
      return "#10b981";
    }

    function getTruthPalette(status) {
      if (status === "tp") return { stroke: "#dc2626", fill: "#b91c1c", label: "TP" };
      if (status === "fn") return { stroke: "#22c55e", fill: "#16a34a", label: "FN" };
      if (status === "fp") return { stroke: "#f59e0b", fill: "#f97316", label: "FP" };
      return null;
    }

    function isObservedFrameData(data) {
      return Boolean(data?.frames && data?.source === "observed-derived");
    }

    function buildRealFrameBundle(realData) {
      if (!isObservedFrameData(realData)) return null;
      const historyByRegion = {};
      realData.frames.forEach((frameItem, frameIndex) => {
        (frameItem.items || []).forEach((entry) => {
          if (!historyByRegion[entry.regionId]) historyByRegion[entry.regionId] = [];
          historyByRegion[entry.regionId][frameIndex] = {
            probability: Number((entry.smoothProb ?? entry.rawProb ?? 0.12).toFixed(2)),
            currentFlow: Number(entry.currentFlow ?? 0),
            avgFlow: Number(entry.avgFlow ?? 0),
            truthStatus: entry.truthStatus || null
          };
        });
      });
      return { historyByRegion };
    }

    function getAdaptiveDiffThreshold(grid) {
      if (grid?.isObservedData) return Math.max(0.45, Number(grid.flowStd || 0.6) * 1.25);
      return 18;
    }

    function getFlowBarWidth(value, grid) {
      if (grid?.isObservedData) {
        const scale = Math.max(Math.abs(grid.currentFlow || 0), Math.abs(grid.avgFlow || 0), Math.abs(grid.flowStd || 0), 1);
        return clamp(((value + scale) / (scale * 2)) * 100, 8, 100);
      }
      return Math.min(100, Math.abs(Number(value || 0)) / 2);
    }

    function getGridAlertLevel(grid) {
      if (grid?.isObservedData) {
        const zScore = Math.abs(Number(grid.flowZScore || 0));
        if (grid.probability >= 0.75 || zScore >= 2.2) return "high";
        if (grid.probability >= 0.6 || zScore >= 1.3) return "medium";
        return "low";
      }
      if (grid?.probability >= 0.75) return "high";
      if (grid?.probability >= 0.45) return "medium";
      return "low";
    }

    function getDataSourceLabel(activeRealData) {
      if (activeRealData?.frames && activeRealData?.source === "model-export") return "模型预测输出";
      if (activeRealData?.frames && activeRealData?.source === "observed-derived") return "真实观测驱动";
      if (activeRealData?.frames) return "本地时序数据";
      if (activeRealData) return "真实数据映射";
      return "默认演示数据";
    }

    function getDataSourceStatus(dataSourceMode, activeRealData, realDataMap) {
      if (dataSourceMode === "demo") return "已强制使用演示数据";
      if (dataSourceMode === "mapped" && activeRealData) return "已切换到 legacy 映射数据";
      if (activeRealData?.frames && activeRealData?.source === "observed-derived") return "已加载本地真实观测样本";
      if (activeRealData) return "已加载本地数据";
      if (realDataMap) return "当前城市缺少对应数据";
      return "未检测到外部数据文件";
    }

    function formatRuntimeUpdatedAt(value) {
      if (!value) return "未记录";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "未记录";
      return `${date.getUTCFullYear()}-${String(date.getUTCMonth() + 1).padStart(2, "0")}-${String(date.getUTCDate()).padStart(2, "0")} ${String(date.getUTCHours()).padStart(2, "0")}:${String(date.getUTCMinutes()).padStart(2, "0")} UTC`;
    }

    function getFrameSourceMeta(activeRealData, currentIndex) {
      if (!activeRealData?.frames?.length) return null;
      const frame = activeRealData.frames[Math.min(currentIndex, activeRealData.frames.length - 1)];
      if (!frame) return null;
      return {
        frameIndex: Number(frame.timeIndex ?? currentIndex),
        sourceIndex: frame.sourceIndex !== undefined ? Number(frame.sourceIndex) : null,
        sampledCount: Number(activeRealData.frames.length),
        windowCount: Number(activeRealData.windowCount ?? 0),
      };
    }
    function createTimelineHistory(seed, incidentIndexes) {
      return TIME_POINTS.map((_, index) => {
        const distance = Math.abs(index - seed.peakIndex);
        const gaussian = Math.max(0, 1 - distance * 0.16);
        const hasIncident = incidentIndexes.includes(index);
        const eventBoost = hasIncident ? 0.34 : gaussian * seed.eventWeight;
        const commuteBoost = index >= 6 && index <= 10 ? 0.1 : 0.03;
        const decayPenalty = index > seed.peakIndex ? (index - seed.peakIndex) * 0.05 : 0;
        const probability = clamp(seed.baseRisk + commuteBoost + eventBoost - decayPenalty, 0.12, 0.96);
        const currentFlow = Math.round(seed.baseFlow + index * 3 + gaussian * 24 + (hasIncident ? 46 : 0) - decayPenalty * 22);
        const avgFlow = Math.round(seed.avgFlow + Math.max(0, index - 2) * 2);
        return {
          probability: Number(probability.toFixed(2)),
          currentFlow,
          avgFlow,
          trafficDelta: Math.round(((currentFlow - avgFlow) / avgFlow) * 100),
          hasIncident
        };
      });
    }

    function buildGridFrame(cityKey, timeIndex) {
      const city = CITY_CONFIG[cityKey];
      return city.seeds.map((seed) => {
        const incidentIndexes = city.incidents[seed.id] || [];
        const falseAlarmIndexes = city.falseAlarms[seed.id] || [];
        const missingAlarmIndexes = city.missingAlarms[seed.id] || [];
        const history = createTimelineHistory(seed, incidentIndexes).map((point, index) => ({
          ...point,
          truthStatus: incidentIndexes.includes(index) ? "tp" : falseAlarmIndexes.includes(index) ? "fp" : missingAlarmIndexes.includes(index) ? "fn" : null
        }));
        const current = history[timeIndex];
        const riskScore = current.probability;
        const groundTruthHit = incidentIndexes.includes(timeIndex);
        const falseAlarm = falseAlarmIndexes.includes(timeIndex);
        const missingAlarm = missingAlarmIndexes.includes(timeIndex);
        return {
          ...seed,
          cityKey,
          cityLabel: city.cnLabel,
          isObservedData: false,
          history,
          probability: riskScore,
          currentFlow: current.currentFlow,
          avgFlow: current.avgFlow,
          trafficDelta: current.trafficDelta,
          riskLabel: getRiskText(riskScore),
          alertState: riskScore >= 0.75 ? "active" : riskScore >= 0.6 ? "cooling" : "normal",
          truthStatus: groundTruthHit ? "tp" : falseAlarm ? "fp" : missingAlarm ? "fn" : null,
          hasIncident: groundTruthHit,
          diffValue: current.currentFlow - current.avgFlow
        };
      });
    }

    function buildRealGridFrame(cityKey, timeIndex, realData, realFrameBundle = null) {
      const city = CITY_CONFIG[cityKey];
      const cityData = realData?.[cityKey];

      // 兼容新链路：results/frontend_predictions_*.json
      if (realData?.dataset === cityKey && Array.isArray(realData?.frames)) {
        const frame = realData.frames[Math.min(timeIndex, realData.frames.length - 1)] || { items: [] };
        return frame.items.map((item, index) => {
          const probability = Number(item.smoothProb ?? item.rawProb ?? 0.12);
          const avgFlow = Number(item.avgFlow ?? 0);
          const currentFlow = Number(item.currentFlow ?? 0);
          const diffValue = Number((currentFlow - avgFlow).toFixed(2));
          const history = (realFrameBundle?.historyByRegion?.[item.regionId] || []).map((historyItem) => historyItem || { probability: 0.12, currentFlow: 0, avgFlow: 0, truthStatus: null });
          return {
            id: `${cityKey === "nyc" ? "NYC" : "CHI"}-${String(item.regionId).padStart(2, "0")}`,
            regionId: item.regionId,
            zone: item.zoneName || `区域（${item.x}, ${item.y}）`,
            roadNodes: Number(item.roadDegree ?? (8 + ((item.x + item.y) % 9))),
            poiDensity: item.poiCategory || (item.label ? "事故敏感区" : (Math.abs(diffValue) > 0.6 ? "流量活跃区" : "常规功能区")),
            weather: item.weatherTag || (item.label ? "环境扰动高" : (Math.abs(currentFlow) > Math.abs(avgFlow) ? "环境扰动中" : "环境稳定")),
            cityKey,
            cityLabel: city.cnLabel,
            x: item.x,
            y: item.y,
            probability: Number(probability.toFixed(2)),
            rawProb: item.rawProb,
            smoothProb: item.smoothProb,
            flowStd: item.flowStd,
            flowZScore: item.flowZScore,
            incidentRate: item.incidentRate,
            roadDegree: item.roadDegree,
            poiDegree: item.poiDegree,
            recordDegree: item.recordDegree,
            thresholdValue: item.thresholdValue,
            isObservedData: true,
            currentFlow,
            avgFlow,
            trafficDelta: avgFlow === 0 ? 0 : Math.round((diffValue / (Math.abs(avgFlow) + 0.001)) * 100),
            riskLabel: getRiskText(probability),
            alertState: probability >= 0.75 ? "active" : probability >= 0.6 ? "cooling" : "normal",
            truthStatus: item.truthStatus,
            hasIncident: Boolean(item.label),
            diffValue,
            history
          };
        });
      }

      if (!cityData) return buildGridFrame(cityKey, timeIndex);

      return cityData.grid.map((item, index) => {
        const labelSeries = item.labelSeries || Array(TIME_POINTS.length).fill(0);
        const flowSeries = item.flowSeries || Array(TIME_POINTS.length).fill(0);
        const currentLabel = Number(labelSeries[timeIndex] || 0);
        const currentFlow = Number(flowSeries[timeIndex] || 0);
        const avgFlow = Number(item.avgFlow || 0);
        const diffValue = Number((currentFlow - avgFlow).toFixed(2));
        const flowScore = clamp(Math.abs(diffValue) * 0.35, 0, 0.28);
        const periodicNoise = ((index % 5) - 2) * 0.03;
        const probability = clamp((currentLabel ? 0.72 : 0.16) + flowScore + periodicNoise, 0.06, 0.96);
        const predictedPositive = probability >= 0.62;
        const truthStatus = currentLabel && predictedPositive ? "tp" : currentLabel && !predictedPositive ? "fn" : !currentLabel && predictedPositive ? "fp" : null;
        return {
          id: `${cityKey === "nyc" ? "NYC" : "CHI"}-${String(item.id).padStart(2, "0")}`,
          regionId: item.id,
          zone: `区域（${item.x}, ${item.y}）`,
          roadNodes: 8 + ((item.x + item.y) % 9),
          poiDensity: currentLabel ? "事故敏感区" : (Math.abs(diffValue) > 0.6 ? "流量活跃区" : "常规功能区"),
          weather: currentLabel ? "降雨扰动" : (Math.abs(currentFlow) > Math.abs(avgFlow) ? "天气波动" : "常规天气"),
          cityKey,
          cityLabel: city.cnLabel,
          x: item.x,
          y: item.y,
          probability: Number(probability.toFixed(2)),
          isObservedData: false,
          currentFlow,
          avgFlow,
          trafficDelta: avgFlow === 0 ? 0 : Math.round((diffValue / (Math.abs(avgFlow) + 0.001)) * 100),
          riskLabel: getRiskText(probability),
          alertState: probability >= 0.75 ? "active" : probability >= 0.6 ? "cooling" : "normal",
          truthStatus,
          hasIncident: Boolean(currentLabel),
          diffValue,
          history: labelSeries.map((value, idx) => {
            const flowNow = Number(flowSeries[idx] || 0);
            const histProb = clamp((value ? 0.74 : 0.18) + Math.min(0.26, Math.abs(flowNow - avgFlow) * 0.18) + (((index + idx) % 4) - 1.5) * 0.025, 0.06, 0.95);
            const histTruthStatus = value && histProb >= 0.62 ? "tp" : value && histProb < 0.62 ? "fn" : !value && histProb >= 0.62 ? "fp" : null;
            return {
              probability: Number(histProb.toFixed(2)),
              currentFlow: flowNow,
              avgFlow,
              truthStatus: histTruthStatus
            };
          })
        };
      });
    }

    function getCityPositions(cityKey) {
      return cityKey === "nyc"
        ? [
            { left: 18, top: 22, lat: 40.758, lng: -73.985 }, { left: 37, top: 21, lat: 40.754, lng: -73.972 },
            { left: 57, top: 24, lat: 40.749, lng: -73.958 }, { left: 76, top: 20, lat: 40.760, lng: -73.944 },
            { left: 24, top: 45, lat: 40.744, lng: -74.001 }, { left: 42, top: 43, lat: 40.741, lng: -73.984 },
            { left: 60, top: 46, lat: 40.737, lng: -73.966 }, { left: 79, top: 44, lat: 40.735, lng: -73.949 },
            { left: 22, top: 68, lat: 40.719, lng: -73.998 }, { left: 41, top: 71, lat: 40.721, lng: -73.982 },
            { left: 61, top: 70, lat: 40.717, lng: -73.964 }, { left: 81, top: 67, lat: 40.715, lng: -73.944 }
          ]
        : [
            { left: 17, top: 21, lat: 41.888, lng: -87.635 }, { left: 36, top: 23, lat: 41.891, lng: -87.622 },
            { left: 58, top: 24, lat: 41.889, lng: -87.607 }, { left: 78, top: 22, lat: 41.892, lng: -87.592 },
            { left: 21, top: 46, lat: 41.874, lng: -87.642 }, { left: 40, top: 44, lat: 41.872, lng: -87.627 },
            { left: 60, top: 47, lat: 41.870, lng: -87.610 }, { left: 80, top: 45, lat: 41.868, lng: -87.594 },
            { left: 18, top: 70, lat: 41.856, lng: -87.640 }, { left: 39, top: 71, lat: 41.854, lng: -87.624 },
            { left: 59, top: 69, lat: 41.852, lng: -87.608 }, { left: 79, top: 68, lat: 41.850, lng: -87.592 }
          ];
    }

    function getGridBounds(lat, lng) {
      const latSpan = 0.006;
      const lngSpan = 0.008;
      return [
        [lat - latSpan / 2, lng - lngSpan / 2],
        [lat + latSpan / 2, lng + lngSpan / 2]
      ];
    }

    function getLatLngFromGrid(cityKey, x, y) {
      const origin = cityKey === "nyc"
        ? { lat: 40.705, lng: -74.02, latStep: 0.0105, lngStep: 0.012 }
        : { lat: 41.845, lng: -87.67, latStep: 0.012, lngStep: 0.014 };
      return {
        lat: origin.lat + x * origin.latStep,
        lng: origin.lng + y * origin.lngStep
      };
    }

    function buildGridPositions(cityKey, gridData) {
      const fallbackPositions = getCityPositions(cityKey);
      return gridData.map((grid, index) => (
        grid.x !== undefined && grid.y !== undefined
          ? { ...getLatLngFromGrid(cityKey, grid.x, grid.y), left: 20 + (grid.x * 8), top: 20 + (grid.y * 8) }
          : fallbackPositions[index] || fallbackPositions[0]
      ));
    }

    function getStaticLayerMarkers(gridData, cityKey, positions = []) {
      const configs = {
        facility: {
          icons: ["🚏", "🚦", "🚥"],
          offsetScale: cityKey === "nyc" ? 0.0016 : 0.0019,
          filter: (grid, index) => grid.roadNodes >= 28 || grid.zone.includes("Hub") || grid.zone.includes("Link") || index % 5 === 0
        },
        poi: {
          icons: ["🏫", "🏬", "🏥"],
          offsetScale: cityKey === "nyc" ? 0.0019 : 0.0022,
          filter: (grid, index) => /商业|旅游|医院|会展|文旅|潮流|居住/.test(grid.poiDensity) || index % 4 === 1
        },
        weather: {
          icons: ["☁️", "🌧️", "🌨️"],
          offsetScale: cityKey === "nyc" ? 0.0022 : 0.0025,
          filter: (grid, index) => /雨|阴|云|波动|扰动/.test(grid.weather) || grid.probability >= 0.6 || index % 6 === 2
        }
      };

      const cityPositions = getCityPositions(cityKey);
      const gridIndexMap = Object.fromEntries(gridData.map((grid, index) => [grid.id, index]));

      const resolveCenter = (grid) => {
        const gridIndex = gridIndexMap[grid.id] ?? 0;
        const fallbackPosition = positions[gridIndex] || cityPositions[gridIndex] || cityPositions[0];
        return grid.x !== undefined && grid.y !== undefined
          ? getLatLngFromGrid(cityKey, grid.x, grid.y)
          : { lat: fallbackPosition.lat, lng: fallbackPosition.lng };
      };

      const build = (layerKey) => {
        const config = configs[layerKey];
        return gridData
          .filter(config.filter)
          .slice(0, 8)
          .map((grid, index) => {
            const center = resolveCenter(grid);
            return {
              lat: center.lat + (((index % 3) - 1) * config.offsetScale),
              lng: center.lng + (((index % 4) - 1.5) * config.offsetScale),
              icon: config.icons[index % config.icons.length]
            };
          });
      };

      return {
        facility: build("facility"),
        poi: build("poi"),
        weather: build("weather")
      };
    }

    function buildTopologyEdges(cityKey, gridId, gridData = []) {
      const sourceGrid = gridData.find((item) => item.id === gridId) || gridData[0];
      if (!sourceGrid) return { poi: [], history: [], traffic: [] };

      const positionMap = Object.fromEntries(gridData.map((grid) => [grid.id, grid.x !== undefined && grid.y !== undefined ? getLatLngFromGrid(cityKey, grid.x, grid.y) : null]));
      const neighbors = gridData
        .filter((grid) => grid.id !== sourceGrid.id)
        .map((grid) => {
          const dx = Math.abs((grid.x ?? 0) - (sourceGrid.x ?? 0));
          const dy = Math.abs((grid.y ?? 0) - (sourceGrid.y ?? 0));
          const manhattan = dx + dy;
          return {
            grid,
            poiScore: clamp(0.92 - manhattan * 0.08 - Math.abs((grid.roadNodes ?? 0) - (sourceGrid.roadNodes ?? 0)) * 0.01, 0.2, 0.92),
            historyScore: clamp(0.95 - manhattan * 0.07 - Math.abs((grid.hasIncident ? 1 : 0) - (sourceGrid.hasIncident ? 1 : 0)) * 0.15, 0.2, 0.95),
            trafficScore: clamp(0.91 - manhattan * 0.06 - Math.abs((grid.diffValue ?? 0) - (sourceGrid.diffValue ?? 0)) * 0.03, 0.2, 0.91)
          };
        })
        .sort((a, b) => a.poiScore - b.poiScore);

      const convert = (items, key) => items
        .sort((a, b) => b[key] - a[key])
        .slice(0, 5)
        .map((item) => ({
          from: positionMap[sourceGrid.id],
          to: positionMap[item.grid.id],
          neighborId: item.grid.id,
          score: item[key]
        }));

      return {
        poi: convert([...neighbors], "poiScore"),
        history: convert([...neighbors], "historyScore"),
        traffic: convert([...neighbors], "trafficScore")
      };
    }

    function EChart({ option, className }) {
      const chartRef = useRef(null);
      const instanceRef = useRef(null);
      useEffect(() => {
        if (!chartRef.current) return;
        if (!instanceRef.current) instanceRef.current = echarts.init(chartRef.current);
        instanceRef.current.setOption(option, true);
        const resize = () => instanceRef.current && instanceRef.current.resize();
        const observer = typeof ResizeObserver !== "undefined" ? new ResizeObserver(resize) : null;
        if (observer) observer.observe(chartRef.current);
        window.addEventListener("resize", resize);
        requestAnimationFrame(resize);
        return () => {
          if (observer) observer.disconnect();
          window.removeEventListener("resize", resize);
        };
      }, [option]);
      useEffect(() => () => { if (instanceRef.current) instanceRef.current.dispose(); }, []);
      return <div ref={chartRef} className={className}></div>;
    }

              <p className="mt-3 max-w-3xl text-sm leading-6 text-slate-400">融合双城热力图、真实碰撞评估、可解释空间注意力、多源静态特征与动态损失分析的答辩级可视化大屏。</p>

    function StaticLayersPanel({ staticLayers, setStaticLayers }) {
      const options = [
        { key: "facility", label: "🚏 交通设施" },

    function LeafletStage({ cityKey, gridData, selectedGridId, setSelectedGridId, hoveredGridId, setHoveredGridId, mode, topologyView, staticLayers, truthFilter }) {
      const mapRef = useRef(null);
      const staticLayerRef = useRef(null);
      const topologyLayerRef = useRef(null);
      const cellLayerRef = useRef(null);
      const highlightLayerRef = useRef(null);
      const containerRef = useRef(null);
      const hasFittedRef = useRef(false);

      useEffect(() => {
        const cityView = cityKey === "nyc"
          ? { center: [40.744, -73.985], zoom: 12 }
          : { center: [41.878, -87.635], zoom: 12 };

        if (!mapRef.current) {
          const map = L.map(containerRef.current, {
            zoomControl: true,
            dragging: true,
            scrollWheelZoom: true,
            doubleClickZoom: true,
            boxZoom: true,
            keyboard: true
          }).setView(cityView.center, cityView.zoom);

          L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
            subdomains: "abcd",
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
          }).addTo(map);

          mapRef.current = map;
          staticLayerRef.current = L.layerGroup().addTo(map);
          topologyLayerRef.current = L.layerGroup().addTo(map);
          cellLayerRef.current = L.layerGroup().addTo(map);
          highlightLayerRef.current = L.layerGroup().addTo(map);
        } else {
          mapRef.current.setView(cityView.center, cityView.zoom);
        }
      }, [cityKey]);

      useEffect(() => {
        if (!mapRef.current || !gridData.length) return;
        const positions = buildGridPositions(cityKey, gridData);
        const bounds = L.latLngBounds(positions.map((pos) => [pos.lat, pos.lng]));
        if (bounds.isValid() && !hasFittedRef.current) {
          mapRef.current.fitBounds(bounds.pad(0.18), { animate: true, duration: 0.45 });
          hasFittedRef.current = true;
        }
      }, [cityKey, gridData]);

      useEffect(() => {
        hasFittedRef.current = false;
      }, [cityKey]);

      useEffect(() => {
        if (!mapRef.current || !gridData.length || !selectedGridId) return;
        const positions = buildGridPositions(cityKey, gridData);
        const selectedIndex = gridData.findIndex((grid) => grid.id === selectedGridId);
        const selectedPos = positions[selectedIndex];
        if (!selectedPos) return;
        mapRef.current.flyTo([selectedPos.lat, selectedPos.lng], Math.max(mapRef.current.getZoom(), 12), {
          animate: true,
          duration: 0.45
        });
      }, [cityKey, gridData, selectedGridId]);

      useEffect(() => {
        if (!staticLayerRef.current) return;
        const layer = staticLayerRef.current;
        layer.clearLayers();
        const positions = buildGridPositions(cityKey, gridData);
        const layerPoints = getStaticLayerMarkers(gridData, cityKey, positions);

        staticLayers.forEach((layerKey) => {
          (layerPoints[layerKey] || []).slice(0, 6).forEach((point) => {
            const latlng = [point.lat, point.lng];
            const icon = L.divIcon({
              className: "",
              html: `<div style="font-size:14px;filter:drop-shadow(0 0 8px rgba(0,0,0,.35));">${point.icon}</div>`,
              iconSize: [18, 18],
              iconAnchor: [9, 9]
            });
            L.marker(latlng, { icon, interactive: false }).addTo(layer);
          });
        });
      }, [cityKey, gridData, staticLayers]);

      useEffect(() => {
        if (!topologyLayerRef.current) return;
        const layer = topologyLayerRef.current;
        layer.clearLayers();
        if (topologyView === "off") return;

        const positions = buildGridPositions(cityKey, gridData);
        const positionMap = Object.fromEntries(gridData.map((grid, index) => [grid.id, positions[index]]));
        const activeEdges = (buildTopologyEdges(cityKey, selectedGridId, gridData)[topologyView] || []).slice(0, 3);

        activeEdges.forEach((edge) => {
          const fromLatLng = [positionMap[selectedGridId]?.lat || positions[7].lat, positionMap[selectedGridId]?.lng || positions[7].lng];
          const toLatLng = [positionMap[edge.neighborId].lat, positionMap[edge.neighborId].lng];
          L.polyline([fromLatLng, toLatLng], {
            color: topologyView === "history" ? "#f59e0b" : topologyView === "traffic" ? "#22d3ee" : "#a78bfa",
            weight: Math.max(1.2, edge.score * 3.6),
            opacity: Math.min(0.72, edge.score * 0.78),
            dashArray: "5,7"
          }).addTo(layer);
        });
      }, [cityKey, gridData, selectedGridId, topologyView]);

      useEffect(() => {
        if (!cellLayerRef.current) return;
        const layer = cellLayerRef.current;
        layer.clearLayers();
        const positions = buildGridPositions(cityKey, gridData);

        gridData.forEach((grid, index) => {
          const pos = positions[index];
          const latlng = [pos.lat, pos.lng];
          const selected = grid.id === selectedGridId;
          const bounds = getGridBounds(pos.lat, pos.lng);
          const matchesTruthFilter = truthFilter === "all" || grid.truthStatus === truthFilter;
          const mutedByTruthFilter = mode === "truth" && truthFilter !== "all" && !matchesTruthFilter;
          const truthStyle = mode === "truth" && matchesTruthFilter ? getTruthPalette(grid.truthStatus) : null;
          const fillColor = truthStyle ? truthStyle.fill : getRiskFillColor(grid.probability);
          const strokeColor = selected ? "#e2e8f0" : (truthStyle ? truthStyle.stroke : "rgba(148,163,184,.32)");
          const labelText = truthStyle ? truthStyle.label : `P=${grid.probability.toFixed(2)}`;
          const marker = L.rectangle(bounds, {
            color: strokeColor,
            weight: selected ? 2.4 : (truthStyle ? 1.8 : 0.8),
            fillColor,
            fillOpacity: mutedByTruthFilter ? 0.035 : (truthStyle ? 0.46 : (selected ? 0.34 : 0.12 + grid.probability * 0.16)),
            dashArray: selected ? null : (truthStyle ? "3,2" : "1,3")
          }).addTo(layer);

          marker.on("click", () => setSelectedGridId(grid.id));
          marker.on("mouseover", () => setHoveredGridId(grid.id));
          marker.on("mouseout", () => setHoveredGridId((prev) => prev === grid.id ? null : prev));
        });
      }, [cityKey, gridData, selectedGridId, mode, setHoveredGridId, setSelectedGridId, truthFilter]);

      useEffect(() => {
        if (!highlightLayerRef.current) return;
        const layer = highlightLayerRef.current;
        layer.clearLayers();
        const positions = buildGridPositions(cityKey, gridData);
        const topRiskIds = [...gridData].sort((a, b) => b.probability - a.probability).slice(0, 6).map((item) => item.id);

        gridData.forEach((grid, index) => {
          const pos = positions[index];
          const latlng = [pos.lat, pos.lng];
          const selected = grid.id === selectedGridId;
          const matchesTruthFilter = truthFilter === "all" || grid.truthStatus === truthFilter;
          const truthStyle = mode === "truth" && matchesTruthFilter ? getTruthPalette(grid.truthStatus) : null;
          const labelText = truthStyle ? truthStyle.label : `P=${grid.probability.toFixed(2)}`;

          if (selected || (mode === "truth" && grid.truthStatus && matchesTruthFilter) || (mode === "prediction" && getGridAlertLevel(grid) === "high")) {
            L.circleMarker(latlng, {
              radius: selected ? 7 : 5,
              color: "rgba(255,255,255,.06)",
              weight: 0,
              fillColor: truthStyle ? truthStyle.stroke : (getGridAlertLevel(grid) === "high" ? "#fca5a5" : "#fde68a"),
              fillOpacity: selected ? 0.85 : 0.72
            }).addTo(layer);
          }

          if (selected || hoveredGridId === grid.id || (mode === "prediction" && topRiskIds.slice(0, 4).includes(grid.id)) || (mode === "truth" && grid.truthStatus && matchesTruthFilter)) {
            const labelIcon = L.divIcon({
              className: "",
              html: `<div style="min-width:70px;padding:4px 7px;border-radius:10px;background:rgba(2,8,23,.74);border:1px solid rgba(148,163,184,.10);text-align:center;color:#e2e8f0;font-size:10px;backdrop-filter:blur(8px);"><div style="font-weight:600;letter-spacing:.2px;">${grid.id}</div><div style="font-size:10px;color:${truthStyle ? truthStyle.stroke : "#94a3b8"};margin-top:2px;">${labelText}</div></div>`,
              iconSize: [70, 30],
              iconAnchor: [35, -4]
            });
            L.marker(latlng, { icon: labelIcon, interactive: false }).addTo(layer);
          }
        });
      }, [cityKey, gridData, hoveredGridId, mode, selectedGridId, truthFilter]);

      return <div ref={containerRef} className="leaflet-map"></div>;
    }

    function MapPanel({ cityKey, cityMeta, gridData, selectedGridId, setSelectedGridId, hoveredGridId, setHoveredGridId, mode, setMode, topologyView, setTopologyView, staticLayers, setStaticLayers, truthFilter, setTruthFilter }) {
      return (
        <div className="relative h-full rounded-[26px] border border-cyan-400/15 bg-slate-950/45 p-4 map-grid-bg overflow-hidden">
          <div className="absolute inset-0 opacity-70 pointer-events-none bg-[radial-gradient(circle_at_center,rgba(34,211,238,.08),transparent_58%)]"></div>

          <div className="absolute right-4 top-4 z-20 flex items-center gap-3 map-overlay">

              <div className="text-xs text-cyan-200 font-semibold mb-2">真实碰撞评估</div>
              <div className="interactive"><PillGroup items={[{ key: "prediction", label: "预测模式" }, { key: "truth", label: "真实碰撞评估" }]} activeKey={mode} onChange={setMode} activeClass="bg-rose-400/18 text-rose-100" /></div>
              {mode === "truth" ? (
                <div className="interactive mt-3">
                  <div className="text-xs text-slate-400 mb-2">TP / FP / FN 筛选</div>
                  <PillGroup items={[{ key: "all", label: "全部" }, { key: "tp", label: "TP 命中" }, { key: "fp", label: "FP 误报" }, { key: "fn", label: "FN 漏报" }]} activeKey={truthFilter} onChange={setTruthFilter} activeClass="bg-amber-400/18 text-amber-100" />
                </div>
              ) : null}
            </div>
          </div>

          {/* 创新点：多源静态特征图层叠加，体现系统融合交通设施 / POI / 气象等异构信息 */}
          <div className="map-overlay"><div className="interactive"><StaticLayersPanel staticLayers={staticLayers} setStaticLayers={setStaticLayers} /></div></div>

          <div className="map-shell pt-16">
            <LeafletStage cityKey={cityKey} gridData={gridData} selectedGridId={selectedGridId} setSelectedGridId={setSelectedGridId} hoveredGridId={hoveredGridId} setHoveredGridId={setHoveredGridId} mode={mode} topologyView={topologyView} staticLayers={staticLayers} truthFilter={truthFilter} />
            <div className="city-photo-overlay"></div>
            <div className="map-base"></div>
            <div className="map-overlay pointer-events-none">
              <div className="absolute left-4 bottom-4 z-20 flex gap-2 flex-wrap">
                <span className="legend-chip">{cityMeta.cnLabel} · 真实网格索引驱动</span>
                <span className="legend-chip">当前目标网格：{selectedGridId}</span>
                <span className="legend-chip">空间注意力：{TOPOLOGY_VIEWS.find((item) => item.key === topologyView)?.label}</span>
                <span className="legend-chip">红=命中 / 绿=漏报 / 橙=误报</span>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [cityKey, setCityKey] = useState("chicago");
      const [currentIndex, setCurrentIndex] = useState(8);
      const [playing, setPlaying] = useState(false);
      const [mode, setMode] = useState("prediction");
      const [defenseMode, setDefenseMode] = useState(true);
      const [topologyView, setTopologyView] = useState("off");
      const [staticLayers, setStaticLayers] = useState(["facility", "poi"]);
      const [hoveredGridId, setHoveredGridId] = useState(null);
      const [selectedGridId, setSelectedGridId] = useState("CHI-08");
      const [realDataMap, setRealDataMap] = useState(null);
      const [metricsData, setMetricsData] = useState(REAL_RESULTS);
      const [runtimeMetaMap, setRuntimeMetaMap] = useState({});
      const [topologyMetaMap, setTopologyMetaMap] = useState({});
      const [dataSourceMode, setDataSourceMode] = useState("real");
      const [dataFetchState, setDataFetchState] = useState("loading");
      const [truthFilter, setTruthFilter] = useState("all");

      const cityMeta = CITY_CONFIG[cityKey];
      const activeRealData = useMemo(() => {
        if (!realDataMap) return null;
        if (dataSourceMode === "real") return realDataMap[cityKey] || null;
        if (dataSourceMode === "mapped") return realDataMap.legacy || null;
        if (dataSourceMode === "demo") return null;
        return realDataMap[cityKey] || realDataMap.legacy || null;
      }, [realDataMap, cityKey, dataSourceMode]);
      const realFrameBundle = useMemo(() => buildRealFrameBundle(activeRealData), [activeRealData]);

      const gridData = useMemo(() => activeRealData ? buildRealGridFrame(cityKey, currentIndex, activeRealData, realFrameBundle) : buildGridFrame(cityKey, currentIndex), [cityKey, currentIndex, activeRealData, realFrameBundle]);
      const selectedGrid = useMemo(() => gridData.find((item) => item.id === selectedGridId) || gridData[0], [gridData, selectedGridId]);
      const hoveredGrid = useMemo(() => gridData.find((item) => item.id === hoveredGridId) || selectedGrid, [gridData, hoveredGridId, selectedGrid]);

      useEffect(() => {
        setDataFetchState("loading");
        const fetchFirstAvailable = (paths) => {
          const tryNext = (index) => {
            if (index >= paths.length) return Promise.resolve(null);
            return fetch(paths[index])
              .then((response) => (response.ok ? response.json() : null))
              .then((data) => (data ? data : tryNext(index + 1)))
              .catch(() => tryNext(index + 1));
          };
          return tryNext(0);
        };

        Promise.allSettled([
          fetchFirstAvailable(["results/frontend_predictions_nyc.json", "weights/frontend_predictions_nyc.json"]),
          fetchFirstAvailable(["results/frontend_predictions_chicago.json", "weights/frontend_predictions_chicago.json"]),
          fetch("results/frontend_real_data.json").then((response) => response.ok ? response.json() : null),
          fetchFirstAvailable(["results/frontend_metrics.json"]),
          fetchFirstAvailable(["results/frontend_runtime_meta.json"]),
          fetchFirstAvailable(["results/frontend_topology.json"]),
        ]).then(([nycRes, chicagoRes, legacyRes, metricsRes, runtimeMetaRes, topologyRes]) => {
          const dataMap = {};
          if (nycRes.status === "fulfilled" && nycRes.value) dataMap.nyc = nycRes.value;
          if (chicagoRes.status === "fulfilled" && chicagoRes.value) dataMap.chicago = chicagoRes.value;
          if (legacyRes.status === "fulfilled" && legacyRes.value) dataMap.legacy = legacyRes.value;
          if (metricsRes.status === "fulfilled" && metricsRes.value?.nyc?.models && metricsRes.value?.chicago?.models) {
            setMetricsData(metricsRes.value);
          }
          if (runtimeMetaRes.status === "fulfilled" && runtimeMetaRes.value && typeof runtimeMetaRes.value === "object") {
            setRuntimeMetaMap(runtimeMetaRes.value);
          }
          if (topologyRes.status === "fulfilled" && topologyRes.value && typeof topologyRes.value === "object") {
            setTopologyMetaMap(topologyRes.value);
          }
          if (Object.keys(dataMap).length) {
            setRealDataMap(dataMap);
            setDataFetchState("ready");
            return;
          }
          setDataFetchState("empty");
        }).catch(() => {
          setDataFetchState("error");
        });
      }, []);

      useEffect(() => {
        const defaultId = activeRealData
          ? (cityKey === "chicago" ? "CHI-00" : "NYC-00")
          : (cityKey === "chicago" ? "CHI-08" : "NYC-08");
        setSelectedGridId(defaultId);
        setHoveredGridId(null);
      }, [cityKey, activeRealData]);

      useEffect(() => {
        if (!gridData.length) return;
        const exists = gridData.some((item) => item.id === selectedGridId);
        if (!exists) setSelectedGridId(gridData[0].id);
      }, [gridData, selectedGridId]);

      useEffect(() => {
        if (!playing) return;
        const timer = setInterval(() => {
          setCurrentIndex((prev) => prev >= TIME_POINTS.length - 1 ? 0 : prev + 1);
        }, 1300);
        return () => clearInterval(timer);
      }, [playing]);

      const gridSummary = useMemo(() => gridData.reduce((summary, item) => {
        if (getGridAlertLevel(item) === "high") summary.highRiskCount += 1;
        if (item.truthStatus === "tp") summary.hitCount += 1;
        if (item.truthStatus === "fp") summary.falseAlarmCount += 1;
        if (item.truthStatus === "fn") summary.missingAlarmCount += 1;
        summary.sorted.push(item);
        return summary;
      }, {
        highRiskCount: 0,
        hitCount: 0,
        falseAlarmCount: 0,
        missingAlarmCount: 0,
        sorted: []
      }), [gridData]);
      const highRiskCount = gridSummary.highRiskCount;
      const hitCount = gridSummary.hitCount;
      const falseAlarmCount = gridSummary.falseAlarmCount;
      const missingAlarmCount = gridSummary.missingAlarmCount;
      const activeTruthCount = hitCount + falseAlarmCount + missingAlarmCount;
      const dynamicPenalty = hoveredGrid.isObservedData
        ? (Math.abs(Number(hoveredGrid.flowZScore || 0)) * 16) + (Math.abs(hoveredGrid.diffValue) * 11)
        : Math.abs(hoveredGrid.diffValue) * 18;
      const dynamicStabilityScore = clamp(100 - dynamicPenalty - highRiskCount * 2.2 + (hoveredGrid.probability < 0.65 ? 8 : 0), 18, 96);
      const sortedGridData = useMemo(() => [...gridSummary.sorted].sort((a, b) => b.probability - a.probability), [gridSummary]);
      const filteredSortedGridData = useMemo(() => (
        mode !== "truth" || truthFilter === "all" ? sortedGridData : sortedGridData.filter((item) => item.truthStatus === truthFilter)
      ), [sortedGridData, truthFilter, mode]);
      const topRiskGrid = sortedGridData[0] || null;
      const truthFilterLabel = truthFilter === "tp" ? "TP 命中" : truthFilter === "fp" ? "FP 误报" : truthFilter === "fn" ? "FN 漏报" : "全部";

      useEffect(() => {
        if (mode !== "truth" || truthFilter === "all" || !filteredSortedGridData.length) return;
        const selectedMatches = filteredSortedGridData.some((item) => item.id === selectedGridId);
        if (!selectedMatches) {
          setSelectedGridId(filteredSortedGridData[0].id);
          setHoveredGridId(null);
        }
      }, [mode, truthFilter, filteredSortedGridData, selectedGridId]);

      const sourceLabel = getDataSourceLabel(activeRealData);
      const sourceStateLabel = getDataSourceStatus(dataSourceMode, activeRealData, realDataMap);
      const modeSummary = mode === "truth" ? "当前以真实碰撞评估为主，强调 TP / FN / FP 的空间落点。" : "当前以预测风险热区为主，强调预警强度与动态演化。";
      const riskSummaryTone = getGridAlertLevel(hoveredGrid) === "high" ? "rose" : getGridAlertLevel(hoveredGrid) === "medium" ? "amber" : "emerald";

      const cityResults = metricsData?.[cityKey] || REAL_RESULTS[cityKey];
      const runtimeMeta = runtimeMetaMap?.[cityKey] || null;
      const frameSourceMeta = getFrameSourceMeta(activeRealData, currentIndex);
      const topologyRegionMeta = topologyMetaMap?.[cityKey]?.[String(hoveredGrid.regionId ?? "")] || null;

      const focusTopRiskGrid = () => {
        if (!topRiskGrid) return;
        setSelectedGridId(topRiskGrid.id);
        setHoveredGridId(null);
        setMode("prediction");
        setPlaying(false);
      };

      const explanationText = useMemo(() => {
        const truthText = hoveredGrid.truthStatus === "tp"
          ? "真实碰撞已被模型命中，适合用于说明高召回策略的有效性"
          : hoveredGrid.truthStatus === "fn"
            ? "真实碰撞出现但当前预警不足，应重点解释漏报原因和后续阈值策略"
            : hoveredGrid.truthStatus === "fp"
              ? "模型给出较高风险但真实未碰撞，可用于说明误报与安全冗余的权衡"
              : "当前未出现真实碰撞，主要作为风险背景和正常样本参照";
        const flowText = hoveredGrid.isObservedData
          ? `标准化流量为 ${Number(hoveredGrid.currentFlow || 0).toFixed(2)}，Z-Score 为 ${Number(hoveredGrid.flowZScore || 0).toFixed(2)}`
          : `当前流量为 ${hoveredGrid.currentFlow}，相对过去 5 小时均值偏差 ${hoveredGrid.diffValue >= 0 ? "+" : ""}${hoveredGrid.diffValue}`;
        const topologyText = topologyRegionMeta
          ? `同时存在道路、POI 或历史碰撞邻接关系，局部拓扑为该网格提供了额外解释证据`
          : `当前主要依据流量、道路节点、POI 密度和天气特征解释风险变化`;
        return `${cityMeta.cnLabel} 的 ${hoveredGrid.id}（${hoveredGrid.zone}）当前风险值为 ${hoveredGrid.probability.toFixed(2)}，判定为“${hoveredGrid.riskLabel}”。${flowText}，道路节点数为 ${hoveredGrid.roadNodes}，POI 类型为 ${hoveredGrid.poiDensity}。${truthText}；${topologyText}。答辩时可以强调：该预警不是单点概率展示，而是由动态流量偏差、静态空间特征和真实标签校验共同支撑。`;
      }, [hoveredGrid, cityMeta, topologyRegionMeta]);

      const performanceOption = useMemo(() => ({
        backgroundColor: "transparent",
        tooltip: { trigger: "axis" },
        legend: { top: 2, textStyle: { color: "#cbd5e1" } },
        grid: { top: 42, left: 36, right: 20, bottom: 26 },
        xAxis: { type: "category", data: ["AUC-PR", "AUC-ROC", "F1", "召回率"], axisLine: { lineStyle: { color: "rgba(148,163,184,.28)" } }, axisLabel: { color: "#94a3b8" } },
        yAxis: { type: "value", min: 0.1, max: 0.95, axisLabel: { color: "#94a3b8" }, splitLine: { lineStyle: { color: "rgba(148,163,184,.12)" } } },
        series: [
          { name: "本系统", type: "bar", barWidth: 16, data: [cityResults.models.Myplan.aucpr, cityResults.models.Myplan.aucroc, cityResults.models.Myplan.f1, cityResults.models.Myplan.recall], itemStyle: { color: "#22d3ee", borderRadius: [6, 6, 0, 0] } },
          { name: "SNIPER", type: "bar", barWidth: 16, data: [cityResults.models.SNIPER.aucpr, cityResults.models.SNIPER.aucroc, cityResults.models.SNIPER.f1, cityResults.models.SNIPER.recall], itemStyle: { color: "#8b5cf6", borderRadius: [6, 6, 0, 0] } },
          { name: "GSNet", type: "bar", barWidth: 16, data: [cityResults.models.GSNet.aucpr, cityResults.models.GSNet.aucroc, cityResults.models.GSNet.f1, cityResults.models.GSNet.recall], itemStyle: { color: "#f59e0b", borderRadius: [6, 6, 0, 0] } }
        ]
      }), [cityResults]);

      const ablationOption = useMemo(() => ({
        backgroundColor: "transparent",
        tooltip: { trigger: "axis" },
        legend: { top: 2, textStyle: { color: "#cbd5e1" } },
        grid: { top: 42, left: 36, right: 20, bottom: 30 },
        xAxis: { type: "category", data: ["AUC-PR", "AUC-ROC", "F1", "召回率"], axisLabel: { color: "#94a3b8" }, axisLine: { lineStyle: { color: "rgba(148,163,184,.28)" } } },
        yAxis: { type: "value", min: 0.4, max: 0.95, axisLabel: { color: "#94a3b8" }, splitLine: { lineStyle: { color: "rgba(148,163,184,.12)" } } },
        series: [
          { name: "无平滑+无流式", type: "line", smooth: true, data: [cityResults.ablation.noSmoothNoStream.aucpr, cityResults.ablation.noSmoothNoStream.aucroc, cityResults.ablation.noSmoothNoStream.f1, cityResults.ablation.noSmoothNoStream.recall], lineStyle: { color: "#64748b", width: 2 }, itemStyle: { color: "#94a3b8" } },
          { name: "无平滑门", type: "line", smooth: true, data: [cityResults.ablation.noSmooth.aucpr, cityResults.ablation.noSmooth.aucroc, cityResults.ablation.noSmooth.f1, cityResults.ablation.noSmooth.recall], lineStyle: { color: "#f59e0b", width: 2 }, itemStyle: { color: "#fbbf24" } },
          { name: "无流式后处理", type: "line", smooth: true, data: [cityResults.ablation.noStream.aucpr, cityResults.ablation.noStream.aucroc, cityResults.ablation.noStream.f1, cityResults.ablation.noStream.recall], lineStyle: { color: "#8b5cf6", width: 2 }, itemStyle: { color: "#a78bfa" } },
          { name: "完整模型", type: "line", smooth: true, data: [cityResults.ablation.full.aucpr, cityResults.ablation.full.aucroc, cityResults.ablation.full.f1, cityResults.ablation.full.recall], lineStyle: { color: "#22d3ee", width: 3 }, itemStyle: { color: "#67e8f9" } }
        ]
      }), [cityResults]);

      const trendOption = useMemo(() => ({
        backgroundColor: "transparent",
        tooltip: { trigger: "axis" },
        legend: { top: 2, textStyle: { color: "#cbd5e1" } },
        grid: { top: 42, left: 40, right: 44, bottom: 26 },
        xAxis: { type: "category", data: TIME_POINTS.map((item) => item.slice(11)), axisLabel: { color: "#94a3b8" }, axisLine: { lineStyle: { color: "rgba(148,163,184,.28)" } } },
        yAxis: [
          { type: "value", min: 0, max: 1, axisLabel: { color: "#94a3b8" }, splitLine: { lineStyle: { color: "rgba(148,163,184,.12)" } } },
          { type: "value", axisLabel: { color: "#64748b" }, splitLine: { show: false } }
        ],
        series: [
          {
            name: "风险值",
            type: "line",
            smooth: true,
            symbolSize: 7,
            data: selectedGrid.history.map((item) => item.probability),
            lineStyle: { width: 3, color: "#f43f5e" },
            itemStyle: { color: "#fda4af" },
            areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: "rgba(244,63,94,.35)" }, { offset: 1, color: "rgba(244,63,94,.03)" }]) },
            markLine: { data: [{ xAxis: TIME_POINTS[currentIndex].slice(11) }], symbol: ["none", "none"], lineStyle: { type: "dashed", color: "#22d3ee" } },
            markPoint: {
              symbol: "circle",
              symbolSize: 14,
              itemStyle: { color: "#22d3ee", borderColor: "#e2e8f0", borderWidth: 2 },
              data: [{ coord: [TIME_POINTS[currentIndex].slice(11), selectedGrid.history[currentIndex]?.probability ?? 0] }]
            }
          },
          {
            name: selectedGrid.isObservedData ? "标准化流量" : "当前流量",
            type: "line",
            yAxisIndex: 1,
            smooth: true,
            symbolSize: 5,
            data: selectedGrid.history.map((item) => Number(item.currentFlow ?? 0)),
            lineStyle: { width: 2, color: "#22d3ee", type: "dashed" },
            itemStyle: { color: "#67e8f9" }
          },
          {
            name: "真实标签",
            type: "scatter",
            symbolSize: 12,
            data: selectedGrid.history.map((item, index) => item.truthStatus ? {
              value: [TIME_POINTS[index].slice(11), item.probability],
              itemStyle: { color: getTruthPalette(item.truthStatus)?.stroke || "#94a3b8" }
            } : null).filter(Boolean)
          }
        ]
      }), [selectedGrid, currentIndex]);

      const featureOption = useMemo(() => ({
        backgroundColor: "transparent",
        tooltip: { trigger: "axis" },
        legend: { top: 2, textStyle: { color: "#cbd5e1" } },
        grid: { top: 42, left: 36, right: 20, bottom: 28 },
        xAxis: { type: "category", data: [hoveredGrid.isObservedData ? "标准化流量" : "当前流量", "过去 5 小时均值", hoveredGrid.isObservedData ? "流量Z-Score" : "流量差异", "路网复杂度"], axisLabel: { color: "#94a3b8", interval: 0 }, axisLine: { lineStyle: { color: "rgba(148,163,184,.28)" } } },
        yAxis: { type: "value", axisLabel: { color: "#94a3b8" }, splitLine: { lineStyle: { color: "rgba(148,163,184,.12)" } } },
        series: [
          { name: "观测值", type: "bar", barWidth: 18, data: [hoveredGrid.currentFlow, hoveredGrid.avgFlow, hoveredGrid.isObservedData ? Number(hoveredGrid.flowZScore ?? 0) : hoveredGrid.diffValue, hoveredGrid.roadNodes], itemStyle: { color: ({ dataIndex }) => dataIndex === 2 && Math.abs(hoveredGrid.isObservedData ? Number(hoveredGrid.flowZScore ?? 0) : hoveredGrid.diffValue) > (hoveredGrid.isObservedData ? 1.5 : 18) ? "#f43f5e" : "#38bdf8", borderRadius: [6, 6, 0, 0] } },
          { name: "参考阈值", type: "line", smooth: true, data: [hoveredGrid.avgFlow, hoveredGrid.avgFlow, hoveredGrid.isObservedData ? Math.max(1, Number(hoveredGrid.flowStd ?? 1)) : 15, hoveredGrid.isObservedData ? Number(hoveredGrid.roadDegree ?? hoveredGrid.roadNodes ?? 10) : 20], lineStyle: { color: "#fbbf24", type: "dashed" }, itemStyle: { color: "#fde68a" } }
        ]
      }), [hoveredGrid]);

      const gaugeOption = useMemo(() => ({
        backgroundColor: "transparent",
        series: [{
          type: "gauge",
          startAngle: 180,
          endAngle: 0,
          center: ["50%", "75%"],
          radius: "110%",
          min: 0,
          max: 100,
          splitNumber: 5,
          progress: { show: true, width: 16, itemStyle: { color: "#22c55e" } },
          axisLine: { lineStyle: { width: 16, color: [[0.4, "#ef4444"], [0.7, "#f59e0b"], [1, "#22c55e"]] } },
          axisTick: { distance: -22, splitNumber: 5, lineStyle: { color: "#94a3b8", width: 1 } },
          splitLine: { distance: -24, length: 8, lineStyle: { color: "#cbd5e1", width: 2 } },
          axisLabel: { distance: -4, color: "#94a3b8", fontSize: 10 },
          pointer: { icon: "path://M12 0 L24 80 L12 72 L0 80 Z", length: "62%", width: 10, offsetCenter: [0, "-8%"], itemStyle: { color: "#e2e8f0" } },
          detail: { valueAnimation: true, offsetCenter: [0, "0%"], fontSize: 28, color: dynamicStabilityScore >= 70 ? "#22c55e" : dynamicStabilityScore >= 45 ? "#f59e0b" : "#ef4444", formatter: "{value}%" },
          data: [{ value: Number(dynamicStabilityScore.toFixed(0)) }]
        }]
      }), [dynamicStabilityScore]);

      const imbalanceOption = useMemo(() => ({
        backgroundColor: "transparent",
        tooltip: { trigger: "axis" },
        legend: { top: 2, textStyle: { color: "#cbd5e1" } },
        grid: { top: 44, left: 40, right: 18, bottom: 30 },
        xAxis: { type: "category", data: ["正常样本", "碰撞异常", "假阴性代价", "事故召回率"], axisLabel: { color: "#94a3b8", interval: 0 }, axisLine: { lineStyle: { color: "rgba(148,163,184,.28)" } } },
        yAxis: { type: "value", axisLabel: { color: "#94a3b8" }, splitLine: { lineStyle: { color: "rgba(148,163,184,.12)" } } },
        series: [
          { name: "传统模型偏好", type: "bar", barWidth: 16, data: [99.8, 0.2, 12, 18], itemStyle: { color: "#64748b", borderRadius: [6, 6, 0, 0] } },
          { name: "本系统表现", type: "bar", barWidth: 16, data: [99.3, 0.7, 2, 82.65], itemStyle: { color: "#22d3ee", borderRadius: [6, 6, 0, 0] } }
        ]
      }), []);

      const gateLogs = useMemo(() => {
        const regionText = `区域 ${hoveredGrid.regionId ?? hoveredGrid.id}（${hoveredGrid.x ?? "-"}, ${hoveredGrid.y ?? "-"}）`;
        const eventText = hoveredGrid.truthStatus === "tp" ? "真实碰撞已命中" : hoveredGrid.truthStatus === "fn" ? "真实碰撞出现漏报" : hoveredGrid.truthStatus === "fp" ? "风险升高但实际未碰撞" : "未出现真实碰撞";
        const diffText = hoveredGrid.isObservedData
          ? `标准化流量 ${Number(hoveredGrid.currentFlow || 0).toFixed(2)}，Z-Score ${Number(hoveredGrid.flowZScore || 0).toFixed(2)}`
          : hoveredGrid.diffValue > 0
            ? `流量偏高 ${hoveredGrid.currentFlow.toFixed ? hoveredGrid.currentFlow.toFixed(2) : hoveredGrid.currentFlow} -> 平滑基线 ${Math.round((hoveredGrid.currentFlow + hoveredGrid.avgFlow) / 2)}`
            : `流量回落 ${hoveredGrid.currentFlow}`;
        return [
          `[${TIME_POINTS[currentIndex].slice(11)}:22] 区域监控：${cityMeta.cnLabel} ${regionText} 风险值 ${hoveredGrid.probability.toFixed(2)}，状态判定为${eventText}。`,
          `[${TIME_POINTS[Math.max(0, currentIndex - 1)].slice(11)}:15] 特征更新：区域 ${selectedGrid.regionId ?? selectedGrid.id} 的道路 / POI / 气象特征已刷新，门控权重维持 0.18。`,
          `[${TIME_POINTS[currentIndex].slice(11)}:01] 异常拦截：${regionText} ${diffText}，启用自适应平滑与历史统计约束。`,
          `[${TIME_POINTS[currentIndex].slice(11)}:36] 标签校验：${regionText} 当前判定 = ${hoveredGrid.truthStatus || "normal"}，用于前端命中 / 漏报 / 误报解释展示。`,
          `[${TIME_POINTS[currentIndex].slice(11)}:48] 门控输出: ${mode === "truth" ? "真实标签校验完成" : "预测流进入解码器"}，当前保真度 0.93。`
        ];
      }, [currentIndex, selectedGrid, hoveredGrid, mode, cityMeta]);

      return (
        <div className="min-h-screen w-full p-5 overflow-x-auto overflow-y-auto">
          <div className="dashboard-canvas min-w-[1180px] min-h-[1180px] rounded-[28px] border border-cyan-400/10 bg-slate-950/55 shadow-[0_0_0_1px_rgba(255,255,255,.02),0_20px_50px_rgba(0,0,0,.35)] p-5 flex flex-col gap-4 xl:min-w-[1680px]">
            <HeroSummary
              cityMeta={cityMeta}
              defenseMode={defenseMode}
              mode={mode}
              dataSourceLabel={sourceLabel}
              dataStateLabel={sourceStateLabel}
              topRiskGrid={topRiskGrid}
            />

            <div className="flex flex-wrap items-center gap-2">
              <StatusBadge tone="cyan">展示模式</StatusBadge>
              <button type="button" onClick={() => setDefenseMode(true)} className={`rounded-full px-3 py-1.5 text-xs transition border ${defenseMode ? "border-cyan-300/30 bg-cyan-400/20 text-cyan-100" : "border-slate-700 bg-slate-900/50 text-slate-400"}`}>答辩模式</button>
              <button type="button" onClick={() => setDefenseMode(false)} className={`rounded-full px-3 py-1.5 text-xs transition border ${!defenseMode ? "border-indigo-300/30 bg-indigo-400/20 text-indigo-100" : "border-slate-700 bg-slate-900/50 text-slate-400"}`}>分析模式</button>
              <button type="button" onClick={focusTopRiskGrid} className="rounded-full px-3 py-1.5 text-xs transition border border-rose-300/30 bg-rose-400/15 text-rose-100 hover:bg-rose-400/25">定位最高风险</button>
              {mode === "truth" ? <StatusBadge tone="amber">筛选：{truthFilterLabel}</StatusBadge> : null}
              <StatusBadge tone={riskSummaryTone}>{hoveredGrid.id} · {hoveredGrid.riskLabel}</StatusBadge>
              <StatusBadge tone="slate">{modeSummary}</StatusBadge>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 2xl:grid-cols-3 gap-3">
              <MetricCard title="当前高风险网格" value={highRiskCount} suffix="个" accent="rgba(244,63,94,.55)" subtext="随时间轴实时变化的高风险热区数量" />
              <MetricCard title="命中 / 漏报 / 误报" value={`${hitCount}/${missingAlarmCount}/${falseAlarmCount}`} accent="rgba(34,211,238,.45)" subtext={`真实评估网格 ${activeTruthCount} 个`} />
              <MetricCard title="当前演化时刻" value={TIME_POINTS[currentIndex].slice(11)} accent="rgba(129,140,248,.5)" subtext={`${cityMeta.cnLabel} 城市网格正在联动演化`} />
            </div>

            <DataControlBar
              currentIndex={currentIndex}
              setCurrentIndex={setCurrentIndex}
              playing={playing}
              setPlaying={setPlaying}
              cityKey={cityKey}
              setCityKey={setCityKey}
              dataSourceMode={dataSourceMode}
              setDataSourceMode={setDataSourceMode}
              activeRealData={activeRealData}
              dataFetchState={dataFetchState}
              realDataMap={realDataMap}
              cityMeta={cityMeta}
              runtimeMeta={runtimeMeta}
              frameSourceMeta={frameSourceMeta}
            />

            <DefenseDataNotice
              cityKey={cityKey}
              activeRealData={activeRealData}
              dataFetchState={dataFetchState}
            />

            {(dataFetchState === "error" || dataFetchState === "empty") ? (
              <div className="rounded-2xl border border-amber-400/25 bg-amber-500/10 px-4 py-3 text-sm text-amber-100">
                未读取到本地 JSON 数据，当前使用内置演示数据。若需要加载 results 目录下的数据，请通过本地 Web 服务访问本页，例如在项目目录运行 <span className="font-semibold text-amber-50">python -m http.server</span> 后打开页面。
              </div>
            ) : null}

            <main className="grid grid-cols-1 2xl:grid-cols-[1.15fr_3.15fr_1.35fr] gap-4 flex-1 min-h-[920px]">
              <aside className="glass-panel soft-hover rounded-3xl p-5 flex flex-col min-h-[520px] 2xl:min-h-[920px] gap-4 order-2 2xl:order-1">
                <SectionHeader title="实时预警列表" description="按当前风险值排序，点击网格可联动中央热力图、时序曲线与空间注意力拓扑。" />
                <div className="flex-1 min-h-[280px] max-h-[420px] overflow-auto pr-1 space-y-3">
                  {filteredSortedGridData.map((item) => (
                    <button key={item.id} type="button" onClick={() => setSelectedGridId(item.id)} className={`w-full text-left rounded-2xl px-4 py-3 border cursor-pointer transition-all ${selectedGridId === item.id ? "border-cyan-300/40 bg-cyan-400/10" : "border-slate-700/60 bg-slate-950/30 hover:bg-slate-900/60"}`}>
                      <div className="flex items-center justify-between">
                        <span className="font-semibold text-slate-100">{item.id} · {item.zone}</span>
                        <span className={`text-sm font-bold ${getGridAlertLevel(item) === "high" ? "text-rose-300" : getGridAlertLevel(item) === "medium" ? "text-amber-200" : "text-emerald-300"}`}>{item.probability.toFixed(2)}</span>
                      </div>
                      <div className="mt-2 flex items-center justify-between text-xs text-slate-400">
                        <span>{item.weather}</span>
                        <span>流量变化 {item.trafficDelta > 0 ? "+" : ""}{item.trafficDelta}%</span>
                      </div>
                    </button>
                  ))}
                  {!filteredSortedGridData.length ? (
                    <div className="rounded-2xl border border-slate-700/60 bg-slate-950/30 px-4 py-5 text-sm text-slate-400">
                      当前时刻没有符合“{truthFilterLabel}”筛选条件的网格。
                    </div>
                  ) : null}
                </div>
                <div className="rounded-2xl border border-cyan-400/20 bg-cyan-500/5 p-4">
                  <h3 className="text-base font-semibold text-cyan-200">动态特征波动指数</h3>
                  {/* 创新点：防过平滑仪表盘，对应动态损失对动态演化特征的健康约束 */}
                  <EChart option={gaugeOption} className="h-[190px] w-full mt-2" />
                  <div className="text-xs text-slate-400 leading-5">当前评分会随选中网格的风险、流量偏差和全局高风险数量实时更新，用来判断平滑门是否过度抑制动态变化。</div>
                </div>
              </aside>

              <section className="min-h-[920px] flex flex-col gap-4 order-1 2xl:order-2">
                <div className="glass-panel soft-hover rounded-3xl p-4 min-h-[520px] xl:min-h-[560px] 2xl:min-h-[620px]">
                  <SectionHeader
                    title="城市时空网格热力图"
                    description={`当前城市：${cityMeta.cnLabel}；播放器驱动风险值“更新—衰减”演化，并支持真实碰撞评估与多图空间注意力解释。`}
                    extra={
                      <>
                        <div>当前时刻：<span className="text-cyan-200 font-semibold">{TIME_POINTS[currentIndex]}</span></div>
                        <div className="mt-1">目标网格：<span className="text-amber-200 font-semibold">{selectedGrid.id}</span></div>
                        <div className="mt-1">空间视图：<span className="text-indigo-200 font-semibold">{TOPOLOGY_VIEWS.find((item) => item.key === topologyView)?.label}</span></div>
                        <div className="mt-1">展示模式：<span className="text-cyan-200 font-semibold">{defenseMode ? "答辩模式" : "分析模式"}</span></div>
                      </>
                    }
                  />
                  <MapPanel
                    cityKey={cityKey}
                    cityMeta={cityMeta}
                    gridData={gridData}
                    selectedGridId={selectedGridId}
                    setSelectedGridId={setSelectedGridId}
                    hoveredGridId={hoveredGridId}
                    setHoveredGridId={setHoveredGridId}
                    mode={mode}
                    setMode={setMode}
                    topologyView={topologyView}
                    setTopologyView={setTopologyView}
                    staticLayers={staticLayers}
                    setStaticLayers={setStaticLayers}
                    truthFilter={truthFilter}
                    setTruthFilter={setTruthFilter}
                  />
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 2xl:grid-cols-3 gap-4 min-h-[226px] auto-rows-fr">
                  <div className="glass-panel soft-hover rounded-3xl p-5 min-h-[240px]">
                    <SectionHeader title="模型性能对比" description={`基于 \`p1结果展示.md\` 的真实结果，当前展示本系统、SNIPER、GSNet 在 ${cityMeta.cnLabel} 数据集上的核心指标对比。`} />
                    <EChart option={performanceOption} className="h-[180px] w-full mt-2" />
                  </div>
                  <div className="glass-panel soft-hover rounded-3xl p-5 min-h-[240px]">
                    <SectionHeader title="动态风险趋势" description={`展示 ${cityMeta.cnLabel} ${selectedGrid.id} 的完整时序轨迹，强调风险值“更新—衰减”的动态演化过程。`} />
                    <EChart option={trendOption} className="h-[180px] w-full mt-2" />
                  </div>
                  <div className="glass-panel soft-hover rounded-3xl p-5 min-h-[240px]">
                    <SectionHeader title="消融实验对比" description="基于 `p1结果展示.md` 的真实消融结果，验证平滑门与流式后处理对召回率及综合指标的提升。" />
                    <EChart option={ablationOption} className="h-[180px] w-full mt-2" />
                  </div>
                </div>

                <div className="glass-panel soft-hover rounded-3xl p-5 min-h-[220px]">
                  <SectionHeader title="业务代价、实验结果与答辩总结" description="当前数据极度稀疏：正常样本 99.8% vs 异常碰撞 0.2%。传统模型容易全部判正常，而预警场景中漏报（假阴性）代价致命。" />
                  {/* 创新点：业务代价与极度不平衡分析，对应焦点损失在高召回方向的优化价值 */}
                  <div className="grid grid-cols-1 xl:grid-cols-[1.8fr_1.2fr] gap-4 mt-3 items-center">
                    <EChart option={imbalanceOption} className="h-[170px] w-full" />
                    <div className="rounded-2xl border border-rose-400/15 bg-rose-500/5 p-4 text-sm text-slate-300 leading-6">
                      <div className="text-rose-200 font-semibold">核心卖点</div>
                      <div className="mt-2">在交通预警场景中，漏报（假阴性）代价致命。</div>
                      <div>本系统通过焦点损失牺牲极少量整体准确率，换取了 <span className="text-cyan-200 font-semibold">82.65%</span> 的真实事故召回率。</div>
                      <div className="mt-2">这类“召回优先”的设计更符合实际交通安全业务目标。</div>
                    </div>
                  </div>
                  <div className="grid grid-cols-1 xl:grid-cols-3 gap-4 mt-4">
                    <div className="rounded-2xl border border-cyan-400/15 bg-cyan-500/5 p-4 text-sm text-slate-300 leading-6">
                      <div className="text-cyan-200 font-semibold">主实验结论</div>
                      <div className="mt-2">基于 `p1结果展示.md`，本系统在 {cityMeta.cnLabel} 数据集上的关键指标整体优于多数基线模型。</div>
                      <div className="mt-2">当前城市召回率：<span className="text-cyan-100 font-semibold">{cityResults.models.Myplan.recall.toFixed(4)}</span></div>
                      <div>AUC-PR：<span className="text-cyan-100 font-semibold">{cityResults.models.Myplan.aucpr.toFixed(4)}</span></div>
                      <div>AUC-ROC：<span className="text-cyan-100 font-semibold">{cityResults.models.Myplan.aucroc.toFixed(4)}</span></div>
                    </div>
                    <div className="rounded-2xl border border-indigo-400/15 bg-indigo-500/5 p-4 text-sm text-slate-300 leading-6">
                      <div className="text-indigo-200 font-semibold">消融实验结论</div>
                      <div className="mt-2">完整模型始终优于去除平滑门或去除流式后处理的版本。</div>
                      {defenseMode ? (
                        <div className="mt-2">平滑门与流式后处理共同带来更高召回率与更稳定输出。</div>
                      ) : (
                        <>
                          <div className="mt-2">说明：</div>
                          <div>① 平滑门有效抑制异常扰动；</div>
                          <div>② 流式后处理提升时序稳定性；</div>
                          <div>③ 二者联合带来最优召回率与综合表现。</div>
                        </>
                      )}
                    </div>
                    <div className="rounded-2xl border border-emerald-400/15 bg-emerald-500/5 p-4 text-sm text-slate-300 leading-6">
                      <div className="text-emerald-200 font-semibold">业务总结</div>
                      <div className="mt-2">面对极端不平衡数据，单纯追求准确率并不合理。</div>
                      <div className="mt-2">本系统以高召回为导向，更符合交通碰撞预警“宁可多报、不能漏报”的业务原则。</div>
                      <div className="mt-2">这也是 Attention-LSTM、焦点损失与动态平滑门协同设计的实际价值所在。</div>
                    </div>
                  </div>
                </div>
              </section>

              <aside className="glass-panel soft-hover rounded-3xl p-5 flex flex-col min-h-[520px] 2xl:min-h-[920px] gap-4 order-3">
                <SectionHeader title="自适应平滑门日志" description="滚动展示模型对异常波动、特征缺失、真值校验的底层门控记录。" />
                <div className="insight-card border-cyan-400/20 bg-cyan-500/5 text-sm text-slate-300 leading-6">
                  <div className="flex items-center justify-between gap-3">
                    <div className="text-cyan-200 font-semibold">自动解释话术</div>
                    <div className="text-xs text-slate-400">{hoveredGrid.id}</div>
                  </div>
                  <div className="mt-2">{explanationText}</div>
                </div>
                <div className="flex-1 min-h-[260px] max-h-[360px] overflow-auto pr-1 space-y-3">
                  {/* 创新点：自适应平滑门拦截日志，解释模型如何抑制异常扰动 */}
                  {gateLogs.map((line, index) => (
                    <div key={`${line}-${index}`} className="log-line rounded-2xl p-3 text-sm text-emerald-200 leading-6 shadow-[inset_0_0_0_1px_rgba(255,255,255,.02)]">
                      {line}
                    </div>
                  ))}
                </div>
                <div className="insight-card border-emerald-400/15 bg-emerald-500/5 text-sm text-slate-300 leading-6">
                  <div className="text-emerald-200 font-semibold">当前聚焦城市 / 区域：{cityMeta.cnLabel} / {hoveredGrid.id}</div>
                  <div className="mt-2">真实区域索引：<span className="text-slate-100">{hoveredGrid.regionId ?? "-"}</span>，网格坐标：<span className="text-slate-100">({hoveredGrid.x ?? "-"}, {hoveredGrid.y ?? "-"})</span></div>
                  <div>流量差异：<span className={Math.abs(hoveredGrid.diffValue) > getAdaptiveDiffThreshold(hoveredGrid) ? "text-rose-300 font-semibold" : "text-emerald-300 font-semibold"}>{hoveredGrid.diffValue > 0 ? "+" : ""}{hoveredGrid.diffValue}</span></div>
                  <div>判定状态：{hoveredGrid.truthStatus === "tp" ? "命中（TP）" : hoveredGrid.truthStatus === "fn" ? "漏报（FN）" : hoveredGrid.truthStatus === "fp" ? "误报（FP）" : "正常"}</div>
                  <div>平滑门建议：{Math.abs(hoveredGrid.diffValue) > getAdaptiveDiffThreshold(hoveredGrid) ? "保留结构性增量，抑制局部尖峰噪声" : "维持平稳输出"}</div>
                </div>
                <div className="insight-card border-cyan-400/15 bg-slate-950/35">
                  <div className="flex items-center justify-between">
                    <div className="text-cyan-200 font-semibold">差异特征监控</div>
                    <div className="text-xs text-slate-400">固定监控面板</div>
                  </div>
                  <div className="mt-3 text-xs text-slate-300 space-y-2 leading-5">
                    <div>网格编号：<span className="text-slate-100">{hoveredGrid.id}</span></div>
                    <div>真实区域：<span className="text-slate-100">{hoveredGrid.regionId ?? "-"}</span></div>
                    <div>POI 密度：<span className="text-slate-100">{hoveredGrid.poiDensity}</span></div>
                    <div>道路节点：<span className="text-slate-100">{hoveredGrid.roadNodes}</span></div>
                    <div>天气状态：<span className="text-slate-100">{hoveredGrid.weather}</span></div>
                    <div>风险概率：<span className="text-rose-300 font-semibold">{hoveredGrid.probability.toFixed(2)}</span></div>
                  </div>
                  <div className="mt-3 grid grid-cols-2 gap-2 text-[11px] text-slate-300">
                    <div className="rounded-xl border border-cyan-400/10 bg-slate-900/55 px-3 py-2">流量 Z-Score：<span className="text-cyan-100 font-semibold">{hoveredGrid.flowZScore !== undefined ? Number(hoveredGrid.flowZScore).toFixed(2) : "--"}</span></div>
                    <div className="rounded-xl border border-cyan-400/10 bg-slate-900/55 px-3 py-2">历史事故率：<span className="text-cyan-100 font-semibold">{hoveredGrid.incidentRate !== undefined ? `${Math.round(Number(hoveredGrid.incidentRate) * 100)}%` : "--"}</span></div>
                    <div className="rounded-xl border border-cyan-400/10 bg-slate-900/55 px-3 py-2">POI / 历史关联：<span className="text-cyan-100 font-semibold">{hoveredGrid.poiDegree ?? "--"} / {hoveredGrid.recordDegree ?? "--"}</span></div>
                    <div className="rounded-xl border border-cyan-400/10 bg-slate-900/55 px-3 py-2">阈值参考：<span className="text-cyan-100 font-semibold">{hoveredGrid.thresholdValue !== undefined ? Number(hoveredGrid.thresholdValue).toFixed(2) : getAdaptiveDiffThreshold(hoveredGrid).toFixed(2)}</span></div>
                  </div>
                  <div className="mt-4 border-t border-slate-800 pt-3">
                    {/* 创新点：差异特征计算展示，对比当前流量与过去5小时正常均值 */}
                    <div className="flex items-center justify-between text-[11px] text-slate-400"><span>当前交通流量</span><span>{hoveredGrid.currentFlow}</span></div>
                    <div className="mt-1 h-2.5 rounded-full bg-slate-800 overflow-hidden"><div className="h-full rounded-full" style={{ width: `${getFlowBarWidth(hoveredGrid.currentFlow, hoveredGrid)}%`, background: Math.abs(hoveredGrid.diffValue) > getAdaptiveDiffThreshold(hoveredGrid) ? "#f43f5e" : "#38bdf8" }}></div></div>
                    <div className="mt-3 flex items-center justify-between text-[11px] text-slate-400"><span>过去 5 小时均值</span><span>{hoveredGrid.avgFlow}</span></div>
                    <div className="mt-1 h-2.5 rounded-full bg-slate-800 overflow-hidden"><div className="h-full rounded-full bg-emerald-400/80" style={{ width: `${getFlowBarWidth(hoveredGrid.avgFlow, hoveredGrid)}%` }}></div></div>
                    <div className={`mt-3 text-[11px] font-semibold ${Math.abs(hoveredGrid.diffValue) > getAdaptiveDiffThreshold(hoveredGrid) ? "text-rose-300" : "text-emerald-300"}`}>
                      {Math.abs(hoveredGrid.diffValue) > getAdaptiveDiffThreshold(hoveredGrid) ? `异常抬升 ${hoveredGrid.diffValue >= 0 ? "+" : ""}${hoveredGrid.diffValue}，为高风险关键诱因` : `差异温和 ${hoveredGrid.diffValue >= 0 ? "+" : ""}${hoveredGrid.diffValue}`}
                    </div>
                  </div>
                </div>
                <div className="insight-card border-indigo-400/15 bg-indigo-500/5">
                  <div className="flex items-center justify-between">
                    <div className="text-indigo-200 font-semibold">局部特征剖面</div>
                    <div className="text-xs text-slate-400">{hoveredGrid.id}</div>
                  </div>
                  <EChart option={featureOption} className="h-[180px] w-full mt-3" />
                  <div className="mt-2 text-xs leading-5 text-slate-400">把当前流量、基线、流量差异和路网复杂度放到同一个剖面里，方便答辩时直接解释单个网格为什么被抬升或压低。</div>
                </div>
                <div className="insight-card border-amber-400/15 bg-amber-500/5">
                  <div className="flex items-center justify-between">
                    <div className="text-amber-200 font-semibold">局部邻接拓扑</div>
                    <div className="text-xs text-slate-400">{hoveredGrid.id}</div>
                  </div>
                  <div className="mt-2 text-xs leading-5 text-slate-400">直接读取项目里的道路、POI 和历史记录邻接矩阵，展示当前网格最强的局部关联节点。</div>
                  <div className="mt-3 grid grid-cols-1 gap-3">
                    <TopologyNeighborGroup title="道路邻接" toneClass="text-cyan-200" items={topologyRegionMeta?.road || []} />
                    <TopologyNeighborGroup title="POI 邻接" toneClass="text-emerald-200" items={topologyRegionMeta?.poi || []} />
                    <TopologyNeighborGroup title="历史碰撞邻接" toneClass="text-amber-200" items={topologyRegionMeta?.record || []} />
                  </div>
                </div>
              </aside>
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
